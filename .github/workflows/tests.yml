name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run vwmcp lint src/vwmcp/vwlib.py vw-plugin/vwmcp/vwmcp_bridge.py
      - run: uv build
      - run: uv run python scripts/build-mcpb.py
