[project]
name = "vwmcp"
version = "0.1.0"
description = "MCP server for Vectorworks (Spotlight-first, macOS-native, pure Python)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
vwmcp = "vwmcp.server:main"

[project.urls]
Homepage = "https://github.com/giorgiomoroder/vectorworks-mcp"
Issues = "https://github.com/giorgiomoroder/vectorworks-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vwmcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"vw-plugin/vwmcp/vwmcp_bridge.py" = "vwmcp/_plugin/vwmcp_bridge.py"
